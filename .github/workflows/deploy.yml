name: "Deploy"

concurrency:
  group: "deploy"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v6
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & Verify
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x ./gradlew
          ./gradlew make :generateUpdaterJson
          ZIP=$(ls plugins/Aegires/build/outputs/*.zip | head -n 1)
          mkdir -p /tmp/dexcheck && unzip -o "$ZIP" classes.dex -d /tmp/dexcheck
          DEXDUMP=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name dexdump | sort -V | tail -n 1)
          DUMP=$("$DEXDUMP" -f /tmp/dexcheck/classes.dex)
          test "$(printf '%s\n' "$DUMP" | grep -c 'Laegires/okhttp3/' || true)" -gt 0
          test "$(printf '%s\n' "$DUMP" | grep -c 'Lokhttp3/' || true)" -eq 0
          test "$(printf '%s\n' "$DUMP" | grep -c 'Laegires/okio/' || true)" -gt 0
          test "$(printf '%s\n' "$DUMP" | grep -c 'Lokio/' || true)" -eq 0
          rm -f "$GITHUB_WORKSPACE/builds"/*.zip
          cp "$GITHUB_WORKSPACE/src"/plugins/**/build/outputs/*.zip "$GITHUB_WORKSPACE/builds/"
          cp "$GITHUB_WORKSPACE/src/build/outputs/updater.json" "$GITHUB_WORKSPACE/builds/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          if-no-files-found: error
          path: ${{ github.workspace }}/src/plugins/**/build/outputs/*.zip

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push
